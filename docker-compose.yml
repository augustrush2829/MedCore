services:
  postgres:
    image: postgres:16-alpine
    container_name: medcore-postgres
    environment:
      POSTGRES_DB: medcore
      POSTGRES_USER: medcore
      POSTGRES_PASSWORD: medcore
    ports:
      - "5432:5432"
    volumes:
      - medcore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medcore -d medcore"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  medcore_postgres_data:

