services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: medcore-postgres
    environment:
      POSTGRES_DB: medcore
      POSTGRES_USER: medcore
      POSTGRES_PASSWORD: medcore
    ports:
      - "5432:5432"
    volumes:
      - medcore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U medcore -d medcore" ]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: medcore-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  # S3-compatible object storage for local dev. Private by default (no
  # public-read policy is ever applied) - the app creates its bucket on
  # startup via ensure_bucket_exists() and serves objects only through
  # short-lived presigned URLs, never direct MinIO/S3 links.
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: medcore-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: medcore
      MINIO_ROOT_PASSWORD: medcore-minio-secret
    ports:
      - "9000:9000" # S3 API - matches S3_ENDPOINT_URL=http://localhost:9000
      - "9001:9001" # Web console
    volumes:
      - medcore_minio_data:/data
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  medcore_postgres_data:
  medcore_minio_data:
